name: tmlink
description: "Connect Tournament Manager fields to OBS scenes with a native desktop workspace."
publish_to: 'none'
version: 0.0.1+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  crypto: ^3.0.5
  csv: ^6.0.0
  file_selector: ^1.1.0
  cupertino_icons: ^1.0.8
  flutter_secure_storage: ^11.2.0
  http: ^1.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.2
  web_socket_channel: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
