name: Check DWAB authorization

# Never run a secret-bearing job against pull request code.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorize:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    environment: dwab
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.41.2'
          channel: stable
      - run: flutter pub get
      # Secrets exist only in this step's environment. No build definitions,
      # credential files, OAuth tokens, or artifacts are published.
      - name: Verify client credentials
        env:
          VEX_TM_CLIENT_ID: ${{ secrets.VEX_TM_CLIENT_ID }}
          VEX_TM_CLIENT_SECRET: ${{ secrets.VEX_TM_CLIENT_SECRET }}
        run: dart run tool/check_dwab_auth.dart
